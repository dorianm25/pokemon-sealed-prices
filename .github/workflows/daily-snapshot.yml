name: Daily Portfolio Snapshot

# Déclenche le snapshot quotidien du portfolio + refresh des prix eBay
# pour tous les produits détenus par les utilisateurs.
# Fonctionne même si le serveur Render dort (le webhook le réveille).
#
# ⚠️ Anti-desactivation GitHub : les workflows planifies sont desactives
# automatiquement apres 60 jours d'inactivite. On ajoute plusieurs runs
# quotidiens et un push mensuel automatique (commit vide) pour garantir
# que ce workflow ne soit jamais coupe.

on:
  schedule:
    # Tous les jours à 02h00 UTC (03h/04h heure de Paris selon l'heure d'été)
    - cron: '0 2 * * *'
    # Backup à 14h00 UTC au cas où le premier run échoue silencieusement
    - cron: '0 14 * * *'
  workflow_dispatch:
    # Permet de lancer manuellement depuis l'onglet Actions de GitHub
  push:
    branches: [master]
    paths:
      # Se relance à chaque push qui touche un fichier lié → keeps workflow "active"
      - '.github/workflows/**'
      - 'server.js'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake up Render server (cold start tolerance)
        run: |
          echo "Ping pour réveiller le serveur..."
          curl -s -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            --max-time 120 \
            "${{ secrets.RENDER_URL }}/api/status" || true

      - name: Trigger daily snapshot (fire and forget)
        run: |
          echo "Déclenchement du snapshot (async, retour immédiat)..."
          # Le serveur repond en < 2 sec puis lance le refresh en background.
          # Render free tier a un timeout dur de 15 min qu'on contournait avant
          # en attendant. Maintenant on fire-and-forget.
          response=$(curl -s -w "\n__HTTP_CODE__:%{http_code}" \
            --max-time 60 \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.RENDER_URL }}/api/cron/daily")

          body=$(echo "$response" | sed -e 's/__HTTP_CODE__:.*//')
          code=$(echo "$response" | grep -o '__HTTP_CODE__:[0-9]*' | cut -d: -f2)

          echo "HTTP $code"
          echo "$body"

          if [ "$code" != "200" ]; then
            echo "::error::Cron trigger failed with HTTP $code"
            exit 1
          fi

      - name: Wait 10 min then check last-run result
        run: |
          # Le background run prend 6-10 min. On attend 10 min puis on
          # verifie que le run a bien fini avec succes.
          echo "Attente 10 min que le background finisse..."
          sleep 600
          echo "Verification du resultat..."
          result=$(curl -s --max-time 30 "${{ secrets.RENDER_URL }}/api/cron/last-run")
          echo "$result"
          status=$(echo "$result" | grep -oE '"status":"[^"]+"' | head -1 | cut -d'"' -f4)
          if [ "$status" != "success" ]; then
            echo "::warning::Cron last-run status = $status (attendu: success)"
          else
            echo "✅ Cron terminé avec succès"
          fi
